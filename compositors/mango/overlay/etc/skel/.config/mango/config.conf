# Mango (mangowm 0.18): the same keymap and conventions as the sway flavour.
# Mod = Super: ⌘ on the MacBook; on a PC keyboard Alt and Win trade places,
# so it is the Alt key there (see "Input").
# Mango has nine tags instead of workspaces; every tag starts tabbed.
# Effects (blur, shadows, animations, rounding) are off: light on old GPUs.
# Reference: https://mangowm.github.io/docs  ·  check this file: mango -c ~/.config/mango/config.conf -p

# ---- Look ---------------------------------------------------------------------
blur=0
blur_layer=0
shadows=0
layer_shadows=0
# When on (Settings → Appearance): a small, faint shadow, not Mango's large
# opaque default (size 10, blur 15, solid black)
shadows_size=4
shadows_blur=6
shadows_color=0x00000040
border_radius=0
animations=0
layer_animations=0
focused_opacity=1.0
unfocused_opacity=1.0

border_px=2
gap_inner_horizontal=0
gap_inner_vertical=0
gap_outer_horizontal=0
gap_outer_vertical=0
root_color=0x1e1e1eff
border_color=0x2a2a2aff
focus_color=0x5e81acff
urgent_color=0xbf616aff
scratchpad_color=0x5e81acff

# ---- Layouts ------------------------------------------------------------------
# Every tag starts tabbed (monocle with a tab bar), like the other flavours;
# the desktop settings can make it tiled (the tag rules in the generated file).
# Mod+Tab switches tabbed ⇄ tiled, Mod+. tiles (and then flips tile ⇄ vertical
# tile), Mod+, is tabs.
tag_num=9
new_is_master=0
default_master_factor=0.5
circle_layout=tile,vertical_tile
monocle_tab_mode=1
deck_tab_mode=1
# The tab bar, styled like sway's title bars and Hyprland's tab bars: square,
# Noto Sans 10, the focused tab in the accent blue.
tab_bar_height=20
tab_bar_decorate_font_desc=Noto Sans 10
tab_bar_decorate_corner_radius=0
tab_bar_decorate_border_width=0
tab_bar_decorate_padding_x=6
tab_bar_decorate_padding_y=2
tab_bar_decorate_bg_color=0x2a2a2aff
tab_bar_decorate_fg_color=0x888888ff
tab_bar_decorate_focus_bg_color=0x5e81acff
tab_bar_decorate_focus_fg_color=0xffffffff
tab_bar_decorate_border_color=0x1e1e1eff

# ---- Input --------------------------------------------------------------------
# Alt+Shift switches layout (Option+Shift on a Mac; on a PC keyboard the Win
# key, which sends Alt after the swap); Caps Lock and Escape are swapped. Binds match the
# physical key, so they also work in the Russian layout.
xkb_rules_layout=us,ru
xkb_rules_options=grp:alt_shift_toggle,caps:swapescape
repeat_rate=35
repeat_delay=300
sloppy_focus=1
warp_cursor=0
focus_on_activate=1

tap_to_click=1
tap_and_drag=1
trackpad_natural_scrolling=1
trackpad_disable_while_typing=1

# Desktop settings (mbp-settings): keyboard layouts and options (Alt and Win
# trade places on a PC keyboard), key repeat, touchpad, focus follows mouse,
# default layout (the tag rules) and display scale. Overrides the values above.
source=~/.config/mbp/generated/mango.conf

# ---- Autostart ----------------------------------------------------------------
env=XDG_CURRENT_DESKTOP,mango
exec_once=waybar
exec_once=mbp-conf wallpaper
# Notifications, tray icons, clipboard history, night light, popups, idle
# lock/suspend, Tether and (on the live USB) the walkthrough: shared by every
# compositor flavour, see /usr/local/bin/mbp-session-start.
exec_once=mbp-session-start

# ---- Window rules -------------------------------------------------------------
window_rule=is_floating:1,app_id:pavucontrol
window_rule=is_floating:1,app_id:org.pulseaudio.pavucontrol
window_rule=is_floating:1,app_id:nm-connection-editor
window_rule=is_floating:1,width:780,height:560,app_id:live-welcome
window_rule=is_floating:1,width:820,height:640,app_id:mbp-shortcuts

# ---- Shortcuts you can change in Settings -------------------------------------
# Apps (terminal, launcher, files, browser, clipboard), closing, fullscreen,
# floating, tabbed ⇄ tiled (mango-tabs-toggle), the overview, scratchpad,
# screenshots, power menu, lock, the cheat sheet...: Settings → Keyboard
# shortcuts writes them, with their defaults and your own, to this file. The
# keys below stay fixed.
source=~/.config/mbp/generated/mango-binds.conf

# ---- Windows ------------------------------------------------------------------
# Esc leaves the overview. "p" passes the key on, so Esc still reaches apps
# everywhere else (leaving does nothing when the overview isn't open); in the
# overview the focused window gets the Esc too.
bindp=NONE,Escape,leaveoverview
bind=SUPER,bracketleft,focusstack,prev
bind=SUPER,bracketright,focusstack,next

# Mod+H J K L resize (narrower, taller, shorter, wider; hold to repeat), Mod+arrows
# focus, and Shift with either moves the window.
bind=SUPER,h,resizewin,-20,+0
bind=SUPER,j,resizewin,+0,+20
bind=SUPER,k,resizewin,+0,-20
bind=SUPER,l,resizewin,+20,+0
bind=SUPER,Left,focusdir,left
bind=SUPER,Down,focusdir,down
bind=SUPER,Up,focusdir,up
bind=SUPER,Right,focusdir,right

bind=SUPER+SHIFT,h,move_client,left
bind=SUPER+SHIFT,j,move_client,down
bind=SUPER+SHIFT,k,move_client,up
bind=SUPER+SHIFT,l,move_client,right
bind=SUPER+SHIFT,Left,move_client,left
bind=SUPER+SHIFT,Down,move_client,down
bind=SUPER+SHIFT,Up,move_client,up
bind=SUPER+SHIFT,Right,move_client,right

mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# ---- Tags (workspaces) --------------------------------------------------------
# Mod+A / Mod+S: the tag to the left / right (the next one is empty until you
# use it, so there's always an empty one to the right). Shift takes the window.
bind=SUPER,a,viewtoleft,0
bind=SUPER,s,viewtoright,0
bind=SUPER+SHIFT,a,tagtoleft,0
bind=SUPER+SHIFT,s,tagtoright,0

bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0
bind=SUPER+SHIFT,1,tagsilent,1
bind=SUPER+SHIFT,2,tagsilent,2
bind=SUPER+SHIFT,3,tagsilent,3
bind=SUPER+SHIFT,4,tagsilent,4
bind=SUPER+SHIFT,5,tagsilent,5
bind=SUPER+SHIFT,6,tagsilent,6
bind=SUPER+SHIFT,7,tagsilent,7
bind=SUPER+SHIFT,8,tagsilent,8
bind=SUPER+SHIFT,9,tagsilent,9

# ---- Layout -------------------------------------------------------------------
bind=SUPER,period,switch_layout
bind=SUPER,comma,setlayout,monocle

# Laptop function keys (work on the lock screen too); levels pop up via wob
bindl=NONE,XF86MonBrightnessUp,spawn,mbp-osd brightness up
bindl=NONE,XF86MonBrightnessDown,spawn,mbp-osd brightness down
bindl=NONE,XF86KbdBrightnessUp,spawn,mbp-osd keyboard up
bindl=NONE,XF86KbdBrightnessDown,spawn,mbp-osd keyboard down
bindl=NONE,XF86AudioRaiseVolume,spawn,mbp-osd volume up
bindl=NONE,XF86AudioLowerVolume,spawn,mbp-osd volume down
bindl=NONE,XF86AudioMute,spawn,mbp-osd volume mute
bindl=NONE,XF86AudioPlay,spawn,playerctl play-pause
bindl=NONE,XF86AudioNext,spawn,playerctl next
bindl=NONE,XF86AudioPrev,spawn,playerctl previous

# ---- Resize mode (Mod+R; arrows or H J K L, Enter/Esc to leave) ---------------
key_mode=resize
bind=NONE,h,resizewin,-20,+0
bind=NONE,l,resizewin,+20,+0
bind=NONE,k,resizewin,+0,-20
bind=NONE,j,resizewin,+0,+20
bind=NONE,Left,resizewin,-20,+0
bind=NONE,Right,resizewin,+20,+0
bind=NONE,Up,resizewin,+0,-20
bind=NONE,Down,resizewin,+0,+20
bind=NONE,Return,setkeymode,default
bind=NONE,Escape,setkeymode,default
# Back to the default mode, so anything after this (or sourced) is a normal bind
key_mode=default

