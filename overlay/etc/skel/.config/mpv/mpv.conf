# Tuned for the 2011 MacBook Pro's Intel HD 3000.

# Hardware decoding through VA-API (libva-intel-driver). This chip decodes
# H.264, MPEG-2 and VC-1 itself; VP9, HEVC and AV1 fall back to the CPU.
hwdec=auto-safe

# Cheaper scaling and no extra processing: smoother on an old GPU and
# easier on the battery, with little visible difference at 1280x800.
profile=fast
