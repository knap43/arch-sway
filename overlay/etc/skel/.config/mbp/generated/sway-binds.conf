# Generated by mbp-conf from Settings → Keyboard shortcuts; edits here are overwritten
bindsym --to-code {
    $mod+d exec $term
    $mod+space exec $menu
    $mod+q exec $menu
    $mod+e exec thunar
    $mod+b exec flatpak run app.zen_browser.zen
    $mod+v exec cliphist list | fuzzel --dmenu --prompt "Clipboard: " | cliphist decode | wl-copy
    $mod+w kill
    $mod+Tab layout toggle tabbed split
    $mod+f fullscreen
    $mod+Shift+f floating toggle
    $mod+g exec sway-layout float-all
    $mod+Return exec sway-layout left-half
    $mod+Shift+Tab exec sway-cycle-windows
    $mod+Shift+grave move scratchpad
    $mod+grave scratchpad show
    $mod+r mode "resize"
    $mod+slash exec mbp-shortcuts --toggle
    $mod+Ctrl+s exec mbp-screenshot
    $mod+Ctrl+Shift+s exec mbp-screenshot --full
    $mod+Escape exec mbp-power-menu
    $mod+Shift+q exec mbp-power-menu
    $mod+n exec mbp-nightlight toggle
    $mod+Shift+c reload
}

# Settings switches to this mode while you press a new shortcut, so the
# keys reach it; ⌘ Ctrl Esc leaves it should Settings go away.
mode "mbp-capture" {
    bindsym --to-code $mod+Ctrl+Escape mode default
}
