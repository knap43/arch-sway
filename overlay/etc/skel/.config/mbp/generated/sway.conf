# Generated by mbp-conf from ~/.config/mbp/settings.conf: change it with mbp-settings.
input type:keyboard {
    xkb_layout us,ru
    xkb_options caps:swapescape,grp:alt_shift_toggle
    repeat_delay 300
    repeat_rate 35
}
input type:touchpad {
    natural_scroll enabled
    tap enabled
    dwt enabled
    pointer_accel 0
    left_handed disabled
}
input type:pointer {
    pointer_accel 0
    left_handed disabled
}
focus_follows_mouse yes
workspace_layout tabbed
output * bg /usr/share/backgrounds/mbp/wallpaper.jpg fill #1e1e1e
output * scale 1
seat * hide_cursor 3000
seat * hide_cursor when-typing enable
bindgesture swipe:3:left exec sway-workspace-next
bindgesture swipe:3:right workspace prev_on_output
