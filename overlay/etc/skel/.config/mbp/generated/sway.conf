# Generated by mbp-conf from ~/.config/mbp/settings.conf: change it with mbp-settings.
input type:keyboard {
    xkb_layout us,ru
    xkb_options caps:swapescape,grp:alt_shift_toggle
    repeat_delay 300
    repeat_rate 35
}
input type:touchpad {
    natural_scroll enabled
    tap enabled
}
focus_follows_mouse yes
workspace_layout tabbed
output * bg /usr/share/backgrounds/mbp/wallpaper.jpg fill #1e1e1e
output * scale 1
